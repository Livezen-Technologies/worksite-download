name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  version:
    name: Version & changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.4", coverage: none }
      - run: php scripts/version.php check

  backend:
    name: Backend (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.2", "8.4"]
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, sodium, sqlite3, zip, curl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Lint
        run: find app signing tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
      - name: Tests (SQLite)
        run: vendor/bin/phpunit --no-coverage
      - name: Dependency audit
        run: composer audit --no-dev

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  linux-repos:
    name: Linux repositories script
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      # The real tools too, so the one test that needs them runs here (it is skipped where they are missing).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends reprepro createrepo-c
      - run: bash -n scripts/publish-linux-repos.sh && sh -n scripts/linux-repo-sign.sh
      - run: node --test scripts/tests/*.test.mjs

  sdk:
    name: Bug Trace SDK (${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: [bugtrace-web, bugtrace-electron, bugtrace-react-native]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      # electron / react-native import the web SDK sources, which need its dev dependencies.
      - run: npm ci || npm install
        working-directory: sdks/bugtrace-web
      - run: npm ci || npm install
        working-directory: sdks/${{ matrix.sdk }}
      - run: npm run typecheck
        working-directory: sdks/${{ matrix.sdk }}
      - run: npm test
        working-directory: sdks/${{ matrix.sdk }}
      - run: npm run build
        working-directory: sdks/${{ matrix.sdk }}
