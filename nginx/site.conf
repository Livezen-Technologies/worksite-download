# download.worksuitecloud.com — update-web (TLS terminates at Cloudflare → origin cert here in production).
# updates.worksuitecloud.com, the earlier name, points here too and is served unchanged (server_name _): desktop and
# mobile builds already in the field call its API, and an API POST cannot follow a redirect. Pages carry the
# download.worksuitecloud.com canonical URL, so search engines converge on the new name.
upstream update_api { server update-api:9000; keepalive 32; }

map $http_cf_connecting_ip $client_ip { "" $remote_addr; default $http_cf_connecting_ip; }

server {
    listen 80;
    server_name _;
    root /srv/www;
    server_tokens off;

    # tus chunks are 8 MB (FR-UC-UPL-01); bigger bodies are never needed.
    client_max_body_size 24m;
    client_body_buffer_size 1m;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # API, resolver, feeds and SEO endpoints → CodeIgniter (PHP-FPM).
    location ~ ^/(api/|api-docs|download/|changelog/(feed|atom)$|apps/[^/]+/changelog/(feed|atom)$|apps/[^/]+/releases/[^/]+/checksums\.txt$|sitemap\.xml$|robots\.txt$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/update-center/backend/public/index.php;
        fastcgi_param REMOTE_ADDR $client_ip;
        fastcgi_param HTTPS on;
        fastcgi_request_buffering off;   # stream tus PATCH bodies
        fastcgi_read_timeout 120s;
        fastcgi_pass update_api;
    }

    # Prometheus scrape (§13.4): internal networks only, plus the bearer token checked by the API.
    location = /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/update-center/backend/public/index.php;
        fastcgi_param REMOTE_ADDR $client_ip;
        fastcgi_pass update_api;
    }

    # WorkSuite APT and DNF repositories (worksuite-desktop#351, docs/linux-repositories.md): static files that
    # scripts/publish-linux-repos.sh writes to /srv/linux-repos/public. reprepro's state (/srv/linux-repos/state) is
    # outside the served tree. No listings, no PHP and no SPA fallback: a missing file is a plain 404 apt and dnf
    # understand, and a directory is never a page. Packages never change under their name, so they cache for good;
    # indexes and signatures change with each release, so they cache for minutes.
    location ^~ /apt/ {
        root /srv/linux-repos/public;
        autoindex off;
        types {
            application/vnd.debian.binary-package deb;
            application/gzip gz;
            application/x-xz xz;
            application/pgp-keys gpg asc;
            text/plain sources;
        }
        default_type text/plain;
        add_header Cache-Control "public, max-age=300" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;

        location ~ ^/apt/pool/.*\.deb$ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/snippets/security-headers.conf;
            try_files $uri =404;
        }
        location ~ ^/apt/dists/[a-z]+/(InRelease|Release|Release\.gpg)$ {
            add_header Cache-Control "public, max-age=60, must-revalidate" always;
            include /etc/nginx/snippets/security-headers.conf;
            try_files $uri =404;
        }
    }

    location ^~ /rpm/ {
        root /srv/linux-repos/public;
        autoindex off;
        types {
            application/x-rpm rpm;
            application/xml xml;
            application/gzip gz;
            application/x-xz xz;
            application/x-bzip2 bz2;
            application/zstd zst;
            application/pgp-keys gpg asc;
            text/plain repo;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=300" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;

        location ~ ^/rpm/[a-z]+/packages/[^/]+\.rpm$ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/snippets/security-headers.conf;
            try_files $uri =404;
        }
        location ~ ^/rpm/[a-z]+/repodata/repomd\.xml(\.asc)?$ {
            add_header Cache-Control "public, max-age=60, must-revalidate" always;
            include /etc/nginx/snippets/security-headers.conf;
            try_files $uri =404;
        }
    }

    # Development CDN emulation is never exposed by the production web tier.
    location ^~ /_dev- { return 404; }

    # Hashed assets: immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Public pages: serve the prerendered HTML when present (§5.5), SPA otherwise.
    location / {
        add_header Cache-Control "public, max-age=60" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /prerender$uri/index.html /prerender$uri.html $uri /index.html;
    }

    location ^~ /admin { add_header Cache-Control "no-store" always; include /etc/nginx/snippets/security-headers.conf; add_header X-Robots-Tag "noindex" always; try_files $uri /index.html; }
    location ^~ /portal { add_header Cache-Control "no-store" always; include /etc/nginx/snippets/security-headers.conf; add_header X-Robots-Tag "noindex" always; try_files $uri /index.html; }
}
