# signing-service front: mTLS only — accepts sign requests exclusively from update-api (§3.5).
server {
    listen 8443 ssl;
    ssl_certificate         /run/secrets/signing_tls_cert;
    ssl_certificate_key     /run/secrets/signing_tls_key;
    ssl_client_certificate  /run/secrets/update_api_ca;
    ssl_verify_client       on;
    ssl_protocols           TLSv1.3;
    client_max_body_size    2m;

    location / {
        proxy_set_header X-SSL-Client-S-DN $ssl_client_s_dn;
        proxy_pass http://127.0.0.1:8080;
    }
}
